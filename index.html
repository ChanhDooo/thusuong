<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gửi tặng bạn 20/10</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;1,500&family=Be+Vietnam+Pro:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg1:#2a0f26; --bg2:#5a1b3d; --rose:#f4a6b8; --cream:#fff3ee; --gold:#f2c98a; --err:#ff3b4e;
  --serif:'Playfair Display',Georgia,'Times New Roman',serif;
  --sans:'Be Vietnam Pro','Segoe UI',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:var(--sans);color:var(--cream);overflow:hidden;
  background:radial-gradient(ellipse at 30% 20%,var(--bg2),var(--bg1) 70%);transition:background .4s}
body.err{background:radial-gradient(ellipse at 50% 40%,#7a0a1c,#2a0610 75%)}
.screen{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;padding:20px;text-align:center}
.screen.on{display:flex;animation:fade .7s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
h1{font-family:var(--serif);font-weight:600;font-size:clamp(28px,6vw,46px);line-height:1.2}
.sub{font-weight:300;opacity:.8;margin-top:10px;font-size:15px}

@property --a{syntax:'<angle>';initial-value:0deg;inherits:false}
#s1{background:radial-gradient(ellipse at 50% 0%,#141b2e,#07090f 65%);transition:background .4s}
body.err #s1{background:radial-gradient(ellipse at 50% 40%,#3a0a14,#07090f 70%)}
.otp{width:min(88vw,360px);padding:34px 22px 28px;border-radius:22px;border:1px solid rgba(255,255,255,.08);
  background:rgba(255,255,255,.03);box-shadow:0 30px 80px rgba(0,0,0,.5)}
.otp h2{font:600 22px var(--sans);transition:color .3s}
.otp p{font-weight:300;font-size:13.5px;opacity:.6;margin-top:6px;min-height:20px}
.boxes{position:relative;height:72px;margin:30px 0 22px;display:flex;justify-content:center;gap:12px}
#otp{position:absolute;inset:0;width:100%;height:100%;opacity:0;font-size:16px;border:0;background:none;cursor:text;z-index:3}
.b{--dx:0px;width:56px;height:68px;border-radius:14px;background:#0e1422;border:1px solid #232c42;
  display:flex;align-items:center;justify-content:center;font:500 28px var(--sans);color:#e8eeff;
  transition:transform .6s cubic-bezier(.3,1.25,.5,1),border-color .25s,box-shadow .25s,background .25s,opacity .35s,color .25s}
.b:nth-of-type(1){--dx:102px;--r:-15deg;--y:10px}
.b:nth-of-type(2){--dx:34px;--r:-5deg;--y:-2px}
.b:nth-of-type(3){--dx:-34px;--r:5deg;--y:-2px}
.b:nth-of-type(4){--dx:-102px;--r:15deg;--y:10px}
.b.act{border-color:#4d7cff;box-shadow:0 0 0 3px rgba(77,124,255,.2),0 0 20px rgba(77,124,255,.5)}
.b.act:empty::after{content:"";width:2px;height:26px;background:#7da2ff;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
.b.fill{border-color:#3a4f8a;background:#121b33}
.b.pop{animation:pop2 .25s ease}
@keyframes pop2{50%{transform:scale(1.1)}}
.boxes.fan .b{transform:translateX(calc(var(--dx)*.62)) translateY(var(--y)) rotate(var(--r));border-color:#4d7cff;
  box-shadow:0 8px 20px rgba(0,0,0,.5),0 0 14px rgba(77,124,255,.4)}
.boxes.stack .b{transform:translateX(var(--dx)) scale(.92);color:transparent;border-color:#4d7cff;
  box-shadow:0 0 18px rgba(77,124,255,.5)}
.boxes.stack .b:not(:nth-of-type(4)){opacity:0}
.ring2{position:absolute;left:50%;top:50%;width:92px;height:104px;margin:-52px 0 0 -46px;border-radius:26px;
  padding:3px;opacity:0;transition:opacity .3s;pointer-events:none;
  background:conic-gradient(from var(--a),transparent 0 55%,#5b8cff 90%,transparent);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;
  mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0)}
.boxes.chk .ring2{opacity:1;animation:spin 1s linear infinite}
@keyframes spin{to{--a:360deg}}
.boxes.ok .b:nth-of-type(4){color:#37f0a0;border-color:#37f0a0;background:#0b2a22;box-shadow:0 0 28px rgba(55,240,160,.55);transform:translateX(var(--dx)) scale(1.05)}
.boxes.bad .b:nth-of-type(4){color:#ff4d5e;border-color:#ff4d5e;background:#2a0b12;box-shadow:0 0 28px rgba(255,77,94,.65);animation:shake .5s}
@keyframes shake{20%,60%{translate:-12px 0}40%,80%{translate:12px 0}}
.otp.okt h2{color:#37f0a0}.otp.badt h2{color:#ff6b78}
.otp .tip{font-size:12.5px;opacity:.45;margin-top:4px}
.cover{width:min(78vw,320px);aspect-ratio:3/4;border-radius:160px 160px 14px 14px;overflow:hidden;cursor:pointer;
  border:3px solid var(--gold);box-shadow:0 20px 60px rgba(0,0,0,.5);margin:26px 0 18px;transition:transform .3s;
  animation:float 4s ease-in-out infinite}
.cover:hover{transform:scale(1.03)}
.cover img,.card img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none;user-select:none}
@keyframes float{50%{translate:0 -8px}}
.hint{font-weight:300;font-size:14px;opacity:.75}

.stage{perspective:1100px;width:100%;height:min(62vh,420px);display:flex;align-items:center;justify-content:center;
  touch-action:pan-y;cursor:grab;user-select:none}
.stage:active{cursor:grabbing}
.ring{position:relative;width:min(36vw,170px);aspect-ratio:3/4;transform-style:preserve-3d}
.card{position:absolute;inset:0;border-radius:14px;overflow:hidden;border:2px solid var(--gold);
  box-shadow:0 10px 30px rgba(0,0,0,.45);cursor:pointer;backface-visibility:visible}
.back{margin-top:14px;background:none;border:1px solid rgba(244,166,184,.4);color:var(--cream);
  padding:8px 18px;border-radius:30px;font:300 14px var(--sans);cursor:pointer}

.modal{position:fixed;inset:0;background:rgba(20,5,16,.82);display:none;align-items:center;justify-content:center;padding:22px;z-index:9}
.modal.on{display:flex;animation:fade .3s}
.wish{max-width:440px;width:100%;background:linear-gradient(160deg,#fff3ee,#ffd9e0);color:#4a1530;border-radius:20px;
  padding:34px 28px 26px;text-align:center;box-shadow:0 25px 70px rgba(0,0,0,.6);animation:pop .45s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:scale(.7);opacity:0}}
.wish h2{font-family:var(--serif);font-style:italic;font-weight:500;font-size:26px;margin-bottom:14px}
.wish p{line-height:1.75;font-size:16px}
.wish button{margin-top:22px;background:#7a1f4a;color:#fff;border:0;padding:10px 26px;border-radius:30px;font:400 14px var(--sans);cursor:pointer}

.petal{position:fixed;top:-30px;pointer-events:none;z-index:1;opacity:.8;animation:fall linear infinite}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
@media (prefers-reduced-motion:reduce){.petal,.cover{animation:none}}

:root{--rose:#e8809f;--gold:#fff;--ink:#5a1f3d;--pk:#ef6f9b;--ok:#e0457b;--err:#e63946}
body{color:var(--ink);background:radial-gradient(ellipse at 30% 15%,#fff8fb,#ffd9e6 75%)}
body.err{background:radial-gradient(ellipse at 50% 40%,#ffc2cb,#ff7b8f 85%)}
#s1{background:radial-gradient(ellipse at 50% 0%,#fff8fb,#ffd3e2 70%)}
body.err #s1{background:radial-gradient(ellipse at 50% 40%,#ffc2cb,#ff7b8f 80%)}
.otp{border-color:rgba(239,111,155,.3);background:rgba(255,255,255,.65);box-shadow:0 24px 60px rgba(214,90,130,.22)}
.b{background:#fff;border-color:#f6c3d4;color:var(--ink)}
.b.act{border-color:var(--pk);box-shadow:0 0 0 3px rgba(239,111,155,.2),0 0 18px rgba(239,111,155,.45)}
.b.act:empty::after{background:var(--pk)}
.b.fill{border-color:#eba0ba;background:#ffeaf1}
.boxes.fan .b{border-color:var(--pk);box-shadow:0 8px 18px rgba(214,90,130,.3),0 0 12px rgba(239,111,155,.35)}
.boxes.stack .b{border-color:var(--pk);box-shadow:0 0 18px rgba(239,111,155,.5)}
.ring2{background:conic-gradient(from var(--a),transparent 0 55%,#ef6f9b 90%,transparent)}
.boxes.ok .b:nth-of-type(4){color:var(--ok);border-color:var(--ok);background:#ffe3ee;box-shadow:0 0 26px rgba(224,69,123,.5)}
.boxes.bad .b:nth-of-type(4){color:var(--err);border-color:var(--err);background:#ffe0e3;box-shadow:0 0 26px rgba(230,57,70,.6)}
.otp.okt h2{color:var(--ok)}.otp.badt h2{color:var(--err)}
.cover{border-color:#fff;box-shadow:0 18px 50px rgba(214,90,130,.35)}
.card{border-color:#fff;box-shadow:0 10px 26px rgba(214,90,130,.35)}
.back{border-color:rgba(239,111,155,.5);color:var(--ink);background:rgba(255,255,255,.6)}
.modal{background:rgba(120,40,80,.4)}
.wish{box-shadow:0 25px 60px rgba(120,40,80,.35)}
.wish button{background:var(--ok)}
.snd{position:fixed;top:12px;right:12px;z-index:20;width:40px;height:40px;border-radius:50%;border:1px solid rgba(239,111,155,.4);
  background:rgba(255,255,255,.7);font-size:18px;cursor:pointer}

.cover{aspect-ratio:1/1;border-radius:28px;width:min(78vw,340px)}
.ring{aspect-ratio:1/1;width:min(40vw,190px)}
.card{border-radius:18px}

@keyframes rise{from{opacity:0;transform:translateY(10px)}}
.bell{position:fixed;right:16px;bottom:18px;width:58px;height:58px;border-radius:50%;border:0;background:#fff;
  box-shadow:0 8px 22px rgba(214,90,130,.45);font-size:28px;cursor:pointer;display:none;z-index:15;align-items:center;justify-content:center}
.bell.on{display:flex;animation:pop .5s}
.bell .em{display:inline-block;transform-origin:50% 8%}
.bell.shake .em{animation:ringb .9s ease}
@keyframes ringb{0%,100%{rotate:0deg}10%{rotate:24deg}20%{rotate:-22deg}30%{rotate:18deg}40%{rotate:-16deg}50%{rotate:12deg}60%{rotate:-8deg}70%{rotate:4deg}}
.badge{position:absolute;top:2px;right:2px;min-width:18px;height:18px;border-radius:9px;background:var(--err);color:#fff;font:600 11px/18px var(--sans);text-align:center}
.chat{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:18px;background:rgba(120,40,80,.4);z-index:30}
.chat.on{display:flex;animation:fade .3s}
.cpanel{width:min(94vw,430px);max-height:82vh;display:flex;flex-direction:column;background:#fff7fa;border-radius:22px;overflow:hidden;
  box-shadow:0 25px 60px rgba(120,40,80,.35);color:var(--ink);text-align:left}
.chead{padding:14px 18px;background:#fff;border-bottom:1px solid #f6d3df;display:flex;justify-content:space-between;align-items:center;font-weight:500}
.chead button{border:0;background:none;font-size:18px;cursor:pointer;color:var(--ink)}
.msgs{padding:18px 14px 22px;overflow:auto;display:flex;flex-direction:column;gap:12px;min-height:240px}
.date{text-align:center;font-size:12px;opacity:.5}
.row{display:flex;gap:10px;align-items:flex-start;animation:rise .4s ease}
.av{width:40px;height:40px;border-radius:8px;flex:none;overflow:hidden;background:linear-gradient(135deg,#f7a1bd,#ef6f9b);color:#fff;
  display:flex;align-items:center;justify-content:center;font:600 18px var(--sans)}
.av img{width:100%;height:100%;object-fit:cover}
.col{display:flex;flex-direction:column;gap:4px;min-width:0}
.who{font-size:12.5px;opacity:.65;font-weight:500}
.bub{background:#fff;border:1px solid #f6c3d4;border-radius:4px 16px 16px 16px;padding:11px 14px;font-size:14.5px;line-height:1.65;box-shadow:0 4px 12px rgba(214,90,130,.12)}
.bub.typing{display:flex;gap:5px;padding:14px 16px}
.typing i{width:7px;height:7px;border-radius:50%;background:#ef6f9b;animation:dotb 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes dotb{50%{transform:translateY(-5px);opacity:.4}}
.chip-row{margin-left:50px;animation:rise .4s ease}
.chip{display:inline-flex;gap:8px;align-items:center;background:var(--ok);color:#fff;border:0;padding:9px 14px;border-radius:16px;font:400 14px var(--sans);cursor:pointer;animation:pulse 2s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 7px rgba(224,69,123,.18)}}

.gift{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:rgba(120,40,80,.55);z-index:40;padding:20px}
.gift.on{display:flex;animation:fade .3s}
.gbox{position:relative;width:min(84vw,380px);aspect-ratio:1/1;border-radius:26px;overflow:hidden;border:3px solid #fff;
  background:radial-gradient(circle at 50% 35%,#fff8fb,#ffc8da);box-shadow:0 25px 60px rgba(120,40,80,.4)}
#gphoto,#gcv{position:absolute;inset:0;width:100%;height:100%}
#gphoto{object-fit:cover;opacity:0;transition:opacity 1.6s .4s}
#gphoto.show{opacity:1}
#gcv{cursor:grab;touch-action:none;transition:opacity 1.8s,filter 1.8s,transform 1.8s}
#gcv.gone{opacity:0;filter:blur(14px);transform:scale(1.3);pointer-events:none}
.gcap{color:#fff;font-size:14px;text-align:center}
.spark{position:absolute;left:50%;top:50%;pointer-events:none;animation:spk 1.7s ease-out forwards;z-index:3}
@keyframes spk{to{transform:translate(var(--dx),var(--dy)) scale(.4) rotate(220deg);opacity:0}}

.screen.on{animation:fade 1.6s ease}
.screen.leave{animation:fadeout .9s ease forwards}
@keyframes fadeout{to{opacity:0}}
.b{transition:transform .95s cubic-bezier(.3,1.2,.5,1),border-color .4s,box-shadow .4s,background .4s,opacity .6s,color .4s}
.chat.on{animation:fade .9s ease}
.row,.chip-row{animation:rise 1.1s ease}
.gift.on{animation:fade 1s ease}
.gbox{width:min(90vw,420px)}
#gcv{animation:gin 1.6s ease backwards;transition:opacity 3s,filter 3s,transform 3s}
@keyframes gin{from{opacity:0;transform:scale(.8)}}
#gphoto{transition:opacity 2.8s .6s}
.spark{animation-duration:2.8s}
.modal.on{animation:fade 1.1s ease}
.wish{max-height:94vh;overflow:auto;animation:wishin 1.4s cubic-bezier(.2,1,.3,1)}
@keyframes wishin{from{transform:translateY(24px) scale(.88);opacity:0}}
.wish img{display:block;width:min(100%,42vh);aspect-ratio:1/1;object-fit:cover;border-radius:16px;margin:0 auto 18px;
  box-shadow:0 12px 30px rgba(214,90,130,.35);animation:imgin 1.4s ease both}
@keyframes imgin{from{opacity:0;transform:scale(.85) rotate(-3deg)}}
.wish h2{animation:rise 1.2s ease 1.1s both}
.wish p{min-height:5em;cursor:pointer}
#whd{visibility:hidden}
.wish button{opacity:0;pointer-events:none;transition:opacity 1s}
.wish.done button{opacity:1;pointer-events:auto}

.vbox{position:relative;width:min(92vw,560px);aspect-ratio:16/9;border-radius:22px;overflow:hidden;border:3px solid #fff;background:#2a1020;
  box-shadow:0 25px 60px rgba(120,40,80,.45);cursor:pointer}
#gvid{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#000;border-radius:inherit}
.vph{position:absolute;inset:0;display:none;align-items:center;justify-content:center;text-align:center;padding:20px;color:#fff;font-size:16px;
  background:linear-gradient(135deg,#f7a1bd,#c2548a)}
.vbox.novid .vph{display:flex}
.vcover{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:#fff;font-size:14px;
  background:rgba(70,20,50,.38);transition:opacity 1s;z-index:2}
.vcover.hide{opacity:0;pointer-events:none}
.vplay{width:68px;height:68px;border-radius:50%;background:rgba(255,255,255,.92);color:#e0457b;display:flex;align-items:center;justify-content:center;font-size:28px;padding-left:5px;animation:pulse 2s infinite}
.letter{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(120,40,80,.6);z-index:50}
.letter.on{display:flex;animation:fade 1.2s ease}
.env{position:relative;width:280px;height:180px;opacity:0}
.env.fly{animation:fly 2.2s cubic-bezier(.2,.8,.3,1) forwards}
@keyframes fly{0%{opacity:1;transform:translate(110vw,-60vh) rotate(28deg) scale(.4)}60%{opacity:1;transform:translate(-14px,10px) rotate(-5deg) scale(1.05)}100%{opacity:1;transform:none}}
.eb,.ef,.fl{position:absolute;transition:opacity 1.2s}
.eb{inset:0;background:#f7b9cd;border-radius:10px;box-shadow:0 20px 40px rgba(80,20,50,.4)}
.ef{inset:0;background:#fbd0de;border-radius:10px;z-index:3;clip-path:polygon(0 0,50% 58%,100% 0,100% 100%,0 100%)}
.fl{left:0;top:0;width:100%;height:62%;background:#f4a6bf;z-index:4;clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:top;transition:transform 1.1s ease,opacity 1.2s,z-index 0s .5s}
.env.open .fl{transform:rotateX(180deg);z-index:1}
.env.out .eb,.env.out .ef,.env.out .fl{opacity:0}
.paper{position:absolute;left:50%;top:50%;width:min(88vw,400px);max-height:150px;overflow:hidden;background:#fffaf5;border-radius:12px;padding:26px 24px 22px;
  transform:translate(-50%,-50%) scale(.62);z-index:2;text-align:left;color:#4a1530;box-shadow:0 10px 30px rgba(80,20,50,.3);
  transition:max-height 1.8s ease,transform 1.8s ease}
.env.out .paper{max-height:80vh;overflow:auto;transform:translate(-50%,-50%) scale(1);z-index:6}
.pc{opacity:0;transition:opacity 1.4s .6s}
.env.out .pc{opacity:1}
.paper h2{font-family:var(--serif);font-style:italic;font-weight:500;font-size:24px;margin-bottom:12px;color:#c2417a}
.paper p{font-family:var(--serif);font-size:16px;line-height:1.95;cursor:pointer}
#lhd{visibility:hidden}
.sig,.paper button{opacity:0;transition:opacity 1.2s}
.sig{text-align:right;font-family:var(--serif);font-style:italic;margin-top:14px;color:#c2417a}
.paper button{display:block;margin:16px auto 0;background:var(--ok);color:#fff;border:0;padding:10px 26px;border-radius:30px;font:400 14px var(--sans);cursor:pointer;pointer-events:none}
.paper.done .sig,.paper.done button{opacity:1}
.paper.done button{pointer-events:auto}

@media (min-width:800px) and (min-height:560px){
  .stage{height:min(66vh,560px);perspective:1600px}
  .ring{width:min(24vw,38vh,300px)}
  .card{border-radius:22px}
}
</style>
</head>
<body>

<section class="screen on" id="s1">
  <div class="otp" id="otpCard">
    <h2 id="ttl">Nhập mật khẩu</h2>
    <p id="sub1">Mật khẩu gồm 4 chữ số để mở quà</p>
    <div class="boxes" id="boxes">
      <input id="otp" type="tel" inputmode="numeric" maxlength="4" autocomplete="off" aria-label="Mật khẩu 4 chữ số">
      <div class="b"></div><div class="b"></div><div class="b"></div><div class="b"></div>
      <div class="ring2"></div>
    </div>
    <p class="tip" id="tip">Chạm vào ô để nhập</p>
  </div>
</section>

<section class="screen" id="s2">
  <h1>Chúc mừng 20/10</h1>
  <div class="cover" id="cover"><img id="coverImg" alt="Ảnh kỷ niệm"></div>
  <p class="hint">Chạm vào ảnh để mở tiếp</p>
</section>

<section class="screen" id="s3">
  <h1>Kéo để xoay, chạm để đọc</h1>
  <div class="stage" id="stage"><div class="ring" id="ring"></div></div>
  <p class="hint">Mỗi bức ảnh giữ một lời chúc riêng</p>
  <button class="back" id="back">Quay lại</button>
</section>

<div class="modal" id="modal">
  <div class="wish" id="wishbox"><img id="wimg" alt="Ảnh"><h2 id="wt"></h2><p id="wp"><span id="wsh"></span><span id="whd"></span></p><button id="wc">Đóng</button></div>
</div>

<button class="snd" id="snd" aria-label="Bật/tắt âm thanh">🔊</button>

<button class="bell" id="bell" aria-label="Bạn có tin nhắn mới"><span class="em">🔔</span><span class="badge" id="badge">1</span></button>

<div class="chat" id="chat">
  <div class="cpanel">
    <div class="chead"><span>Tin nhắn</span><button id="cclose" aria-label="Đóng">✕</button></div>
    <div class="msgs" id="msgs"></div>
  </div>
</div>

<div class="gift" id="gift">
  <div class="vbox novid" id="vbox">
    <video id="gvid" playsinline preload="metadata"></video>
    <div class="vph" id="vph">Thay bằng video của bạn<br>(điền tên file vào VIDEO)</div>
    <div class="vcover" id="vcover"><div class="vplay">▶</div><span>Chạm để xem video</span></div>
  </div>
  <p class="gcap" id="gcap">Chạm vào video để phát</p>
  <button class="back" id="gclose">Đóng</button>
</div>

<div class="letter" id="letter">
  <div class="env" id="env">
    <div class="eb"></div>
    <div class="paper" id="paper"><div class="pc"><h2 id="lt"></h2><p id="lp"><span id="lsh"></span><span id="lhd"></span></p><div class="sig" id="lsig"></div><button id="lclose">Đóng thư</button></div></div>
    <div class="ef"></div>
    <div class="fl"></div>
  </div>
</div>

<script>
/* ===== 1) ĐỔI ẢNH: điền đường dẫn ảnh của bạn (để file ảnh cùng thư mục với file html này) =====
   COVER: ảnh bìa.  PHOTOS: đúng 6 ảnh.  Để trống "" thì sẽ hiện ảnh hoa mẫu. */
const PASSWORD = "2109";
/* Tin nhắn trong chuông: tên người gửi, ảnh đại diện (vuông, để "" thì hiện chữ cái đầu), nội dung */
const SENDER = "Nguyễn Đô";
const AVATAR = "";       // ví dụ: "do.jpg"
const MESSAGE = "Tôi chúc Sương 20/10 vui vẻ, hạnh phúc và xinh đẹp. Tuy tôi không có gì nhiều nhưng tôi chỉ làm thứ mình giỏi nhất để tặng cho Sương. Cảm ơn Sương là người lúc nào cũng mang lại tiếng cười và sự tự tin cho tôi.";
const VIDEO = "qua.mp4";        // video quà (ngang 16:9), ví dụ: "qua.mp4" - đặt cùng thư mục
const MUSIC = "chochut.mp3";   // nhạc nền: bài "Chờ chút" của Congb, tải về, đổi tên đúng như vậy và đặt cùng thư mục
const LETTER_TITLE = "Gửi Sương,";
const LETTER = "Cái món quà này tới tay cô chắc cũng qua ngày 20 tháng 10 rồi, thì tôi muốn nòi là cô đi Nhật thì nhớ bảo vệ bản thân nha. Vài hôm nữa Tết cô về thì tôi cũng có quà tặng cho cô, vì tôi biết suốt năm cấp 3, cô đã giúp tôi rất nhiều nhưng chưa có món quà nào là tôi tặng cho cô đàng hoàng cả, mòn quà nay coi như tôi bù đắp lại phần lỗi đó. Làm cái này tôi cũng ngại lắm, ngồi trên lớp code mà mấy đứa bạn cứ bảo ai mà xinh thế, tôi cũng thấy kì chớ. Thôi mong cô sẽ nhận món quà nhỏ này của tôi!.";
const COVER  = "anh0.jpg";
const PHOTOS = ["anh1.jpg", "anh2.jpg", "anh3.jpg", "anh4.jpg", "anh5.jpg", "anh6.jpg"];   // ví dụ: ["anh1.jpg","anh2.jpg",...]

/* ===== 2) ĐỔI LỜI CHÚC (6 lời tương ứng 6 ảnh) ===== */
const WISHES = [
  {t:"Luôn rạng rỡ",       p:"Chúc bạn mỗi ngày thức dậy đều thấy mình xinh đẹp, tự tin và tràn đầy năng lượng. Nụ cười của bạn là điều tuyệt vời nhất."},
  {t:"Bình yên trong tim", p:"Mong những lo toan được nhẹ đi, để bạn luôn có những khoảng lặng bình yên và được làm điều mình yêu thích."},
  {t:"Sức khỏe dồi dào",   p:"Chúc bạn thật nhiều sức khỏe, ăn ngon ngủ khỏe, để đủ sức đi qua mọi chặng đường bạn mong muốn."},
  {t:"Được yêu thương",    p:"Chúc bạn luôn được bao quanh bởi những người yêu thương, trân trọng và hiểu bạn."},
  {t:"Thành công và vững vàng", p:"Mong mọi cố gắng của bạn đều được ghi nhận, mọi dự định đều đơm hoa kết trái đúng lúc."},
  {t:"Hạnh phúc dài lâu",  p:"Cảm ơn bạn đã là một người đặc biệt. Chúc bạn một ngày 20/10 thật vui và một cuộc sống ngập tràn hạnh phúc."}
];

/* ================= Mã chạy (không cần sửa) ================= */
const $ = id => document.getElementById(id);
function show(id, cb){
  const nx = $(id), cur = document.querySelector('.screen.on');
  if (cur === nx){ cb && cb(); return; }
  const go = () => { document.querySelectorAll('.screen').forEach(s => s.classList.remove('on','leave')); nx.classList.add('on'); cb && cb(); };
  if (cur){ cur.classList.add('leave'); setTimeout(go, 900); } else go();
}

// ảnh mẫu (hoa) khi chưa có ảnh thật
const tones = [["#ffd6e4","#f48fb1"],["#ffe3d6","#f7a1a8"],["#ffd9f0","#e58bc4"],["#ffe8ee","#f3a6bd"],["#fff0d9","#f5a9a0"],["#f6dcff","#d9a0e8"]];
function placeholder(i){
  const [a,b] = tones[i % 6];
  const svg = `<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 300 300'><defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='${a}'/><stop offset='1' stop-color='${b}'/></linearGradient></defs><rect width='300' height='300' fill='url(#g)'/><text x='150' y='175' font-size='110' text-anchor='middle'>🌸</text><text x='150' y='255' font-size='20' fill='#7a2a4c' text-anchor='middle' font-family='sans-serif'>Thay bằng ảnh của bạn</text></svg>`;
  return "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg);
}
const src = (v,i) => v || placeholder(i);

// --- âm thanh (tự tạo bằng WebAudio, không cần file) ---
const AC = window.AudioContext || window.webkitAudioContext; let ac = null, muted = false;
function actx(){ if (!ac && AC) ac = new AC(); if (ac && ac.state === 'suspended') ac.resume(); return ac; }
function tone(f, d = .12, type = 'sine', vol = .15, when = 0, slide = 0){
  if (muted) return; const c = actx(); if (!c) return; const t = c.currentTime + when;
  const o = c.createOscillator(), g = c.createGain(); o.type = type; o.frequency.setValueAtTime(f, t);
  if (slide) o.frequency.exponentialRampToValueAtTime(f * slide, t + d);
  g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + .012); g.gain.exponentialRampToValueAtTime(.0001, t + d);
  o.connect(g); g.connect(c.destination); o.start(t); o.stop(t + d + .03);
}
const sfx = {
  key:  i => tone(520 + i * 80, .1, 'triangle', .16),
  del:  () => tone(320, .08, 'triangle', .1, 0, .8),
  fan:  () => [0,1,2,3].forEach(i => tone(420 + i * 90, .14, 'sine', .1, i * .07, 1.25)),
  stack:() => { tone(760, .28, 'sine', .12, 0, .5); tone(380, .2, 'triangle', .08, .05); },
  check:() => { for (let i = 0; i < 8; i++) tone(i % 2 ? 1050 : 900, .05, 'square', .035, i * .16); },
  ok:   () => [523, 659, 784, 1047].forEach((f,i) => tone(f, .35, 'triangle', .16, i * .11)),
  bad:  () => { tone(240, .28, 'sawtooth', .1, 0, .6); tone(170, .34, 'sawtooth', .1, .16, .6); },
  open: () => [1175, 1568, 2093].forEach((f,i) => tone(f, .25, 'sine', .09, i * .07)),
  close:() => tone(520, .12, 'sine', .1, 0, .7),
  bell: () => [0, .32].forEach(t => [1319, 1976, 2637].forEach((f,k) => tone(f, .7, 'sine', .1 / (k + 1), t))),
  msg:  () => { tone(988, .12, 'sine', .12); tone(1319, .2, 'sine', .12, .1); },
  sparkle: () => [1568,1760,2093,2349,2637,3136].forEach((f,i) => tone(f, .3, 'sine', .08, i * .07)),
  grab: () => tone(600, .08, 'sine', .1, 0, 1.3),
  tick: v => tone(880 + Math.random() * 120, .045, 'triangle', Math.min(.13, .03 + Math.abs(v) * .015)),
  wish: i => [880, 1109, 1319, 1760].forEach((f,k) => tone(f * (1 + i * .03), .5, 'sine', .1, k * .09))
};
addEventListener('pointerdown', actx); addEventListener('keydown', actx);
// nhạc nền (bắt đầu sau lần chạm đầu tiên vì trình duyệt không cho tự phát)
const bgm = MUSIC ? new Audio(MUSIC) : null; let bgmOn = false;
if (bgm){ bgm.loop = true; bgm.volume = .10; bgm.preload = 'auto'; }
function startMusic(){ if (!bgm || bgmOn || muted) return; bgm.play().then(() => bgmOn = true).catch(() => {}); }
function duckMusic(on){ if (!bgm) return; if (on){ bgm.pause(); bgmOn = false; } else startMusic(); }
addEventListener('pointerdown', startMusic); addEventListener('keydown', startMusic);
$('snd').onclick = e => {
  e.stopPropagation(); muted = !muted; $('snd').textContent = muted ? '🔇' : '🔊';
  if (muted){ if (bgm){ bgm.pause(); bgmOn = false; } } else { sfx.grab(); startMusic(); }
};

// --- mật khẩu ---
const inp = $('otp'), boxes = $('boxes'), bs = [...boxes.querySelectorAll('.b')], card = $('otpCard');
const sleep = ms => new Promise(r => setTimeout(r, ms));
let busy = false, prevLen = 0;
function paint(){
  const v = inp.value;
  bs.forEach((b,i) => {
    const had = b.textContent;
    b.textContent = v[i] || "";
    b.classList.toggle('fill', i < v.length);
    b.classList.toggle('act', i === Math.min(v.length, 3) && !busy);
    if (v[i] && !had){ b.classList.remove('pop'); void b.offsetWidth; b.classList.add('pop'); }
  });
}
function setText(t, s){ $('ttl').textContent = t; $('sub1').textContent = s; }
inp.addEventListener('input', () => {
  if (busy) return;
  inp.value = inp.value.replace(/\D/g, "").slice(0,4);
  paint();
  const n = inp.value.length;
  if (n > prevLen) sfx.key(n - 1); else if (n < prevLen) sfx.del();
  prevLen = n;
  if (n === 4) verify();
});
$('s1').addEventListener('click', () => { if (!busy) inp.focus(); });
inp.addEventListener('focus', paint);
setTimeout(() => { inp.focus(); paint(); }, 300);

async function verify(){
  busy = true; inp.blur(); $('tip').style.visibility = 'hidden';
  bs.forEach(b => b.classList.remove('act'));
  await sleep(450);
  boxes.classList.add('fan'); sfx.fan();            // xòe như quạt bài
  await sleep(1100);
  boxes.classList.add('stack'); sfx.stack();          // gom về một ô
  await sleep(900);
  boxes.classList.add('chk'); sfx.check();            // vòng sáng kiểm tra
  setText('Đang kiểm tra', 'Chờ một chút nhé…');
  await sleep(2000);
  boxes.classList.remove('chk');
  const good = inp.value === PASSWORD, last = bs[3];
  if (good){
    last.textContent = '✓'; sfx.ok(); boxes.classList.add('ok'); card.classList.add('okt');
    setText('Đã xác minh', 'Đang mở quà cho bạn…');
    await sleep(2200); show('s2'); bloom();
  } else {
    last.textContent = '✕'; sfx.bad(); boxes.classList.add('bad'); card.classList.add('badt'); document.body.classList.add('err');
    setText('Mật khẩu chưa đúng', 'Thử lại nhé');
    await sleep(1600);
    boxes.classList.remove('bad','stack'); last.textContent = '';
    await sleep(600); boxes.classList.remove('fan');
    card.classList.remove('badt'); document.body.classList.remove('err');
    prevLen = 0; inp.value = ''; bs.forEach(b => { b.textContent = ''; b.classList.remove('fill'); });
    setText('Nhập mật khẩu', 'Mật khẩu gồm 4 chữ số để mở quà');
    $('tip').style.visibility = 'visible'; busy = false; inp.focus(); paint();
  }
}

// --- ảnh bìa ---
$('coverImg').src = src(COVER, 0);
$('cover').onclick = () => { sfx.open(); show('s3', () => { layout(); startBell(); }); };
$('back').onclick = () => { sfx.close(); stopBell(); show('s2'); };

// --- vòng 6 ảnh 3D ---
const ring = $('ring'), stage = $('stage'), N = 6;
const cards = PHOTOS.map((p,i) => {
  const c = document.createElement('div'); c.className = 'card';
  const im = document.createElement('img'); im.src = src(p, i+1); im.alt = "Ảnh " + (i+1); im.draggable = false;
  c.appendChild(im); c.dataset.i = i; ring.appendChild(c); return c;
});
let lastSeg = 0, lastTick = 0, rot = 0, vel = 0, dragging = false, moved = 0, lastX = 0, radius = 240;
function layout(){
  const w = ring.offsetWidth || 160;
  radius = Math.round(w / 2 / Math.tan(Math.PI / N)) + 40;
  cards.forEach((c,i) => c.style.transform = `rotateY(${i * 360 / N}deg) translateZ(${radius}px)`);
}
addEventListener('resize', layout);
function frame(){
  if (!dragging){ vel *= 0.95; rot += vel + (Math.abs(vel) < 0.05 ? 0.12 : 0); }
  ring.style.transform = `translateZ(${-radius}px) rotateY(${rot}deg)`;
  const seg = Math.floor(rot / 30), now = performance.now();
  if (seg !== lastSeg){ if ((dragging || Math.abs(vel) > .3) && now - lastTick > 45){ sfx.tick(vel); lastTick = now; } lastSeg = seg; }
  requestAnimationFrame(frame);
}
stage.addEventListener('pointerdown', e => { sfx.grab(); dragging = true; moved = 0; lastX = e.clientX; vel = 0; });
addEventListener('pointermove', e => {
  if (!dragging) return;
  const dx = e.clientX - lastX; lastX = e.clientX; moved += Math.abs(dx);
  rot += dx * 0.45; vel = dx * 0.45;
});
addEventListener('pointerup', e => {
  if (!dragging) return; dragging = false;
  if (moved < 6){
    const card = document.elementFromPoint(e.clientX, e.clientY)?.closest('.card');
    if (card) openWish(+card.dataset.i);
  }
});
layout(); frame();

// --- lời chúc ---
let wTok = 0, wSkip = false;
function openWish(i){
  sfx.wish(i); wTok++; wSkip = false;
  $('wimg').src = src(PHOTOS[i], i + 1); $('wt').textContent = WISHES[i].t;
  $('wsh').textContent = ''; $('whd').textContent = WISHES[i].p;
  $('wishbox').classList.remove('done'); $('modal').classList.add('on'); typeWish(WISHES[i].p);
}
async function typeWish(text){
  const tok = wTok; await sleep(2000); if (tok !== wTok) return;
  for (let i = 1; i <= text.length; i++){
    if (tok !== wTok) return;
    if (wSkip){ $('wsh').textContent = text; $('whd').textContent = ''; break; }
    $('wsh').textContent = text.slice(0, i); $('whd').textContent = text.slice(i);
    await sleep(/[,.!]/.test(text[i - 1]) ? 320 : 55);
  }
  if (tok === wTok) $('wishbox').classList.add('done');
}
function closeWish(){ wTok++; sfx.close(); $('modal').classList.remove('on'); }
$('wp').onclick = () => { wSkip = true; };
$('wc').onclick = closeWish;
$('modal').onclick = e => { if (e.target === $('modal')) closeWish(); };

// --- chuông + tin nhắn ---
const bell = $('bell'), chat = $('chat'), msgs = $('msgs');
let bellTimer = 0, bellLoop = 0, chatStarted = false;
function ringBell(){ bell.classList.remove('shake'); void bell.offsetWidth; bell.classList.add('shake'); sfx.bell(); }
function stopBell(){ clearTimeout(bellTimer); clearInterval(bellLoop); bell.classList.remove('on','shake'); }
function startBell(){
  stopBell();
  if (chatStarted){ bell.classList.add('on'); return; }
  bellTimer = setTimeout(() => { bell.classList.add('on'); ringBell(); bellLoop = setInterval(ringBell, 4500); }, 5000);
}
bell.onclick = () => {
  clearInterval(bellLoop); bell.classList.remove('shake'); $('badge').style.display = 'none';
  chat.classList.add('on'); sfx.open();
  if (!chatStarted){ chatStarted = true; playChat(); }
};
$('cclose').onclick = () => { sfx.close(); chat.classList.remove('on'); };
chat.onclick = e => { if (e.target === chat) chat.classList.remove('on'); };

const add = (cls, build) => { const r = document.createElement('div'); r.className = cls; build(r); msgs.appendChild(r); msgs.scrollTop = msgs.scrollHeight; return r; };
function avatar(){
  const a = document.createElement('div'); a.className = 'av';
  if (AVATAR){ const im = document.createElement('img'); im.src = AVATAR; im.alt = SENDER; a.appendChild(im); }
  else a.textContent = SENDER.trim().split(/\s+/).pop()[0].toUpperCase();
  return a;
}
async function playChat(){
  add('date', r => r.textContent = 'Hôm nay');
  await sleep(1000);
  const t = add('row', r => { r.appendChild(avatar()); const c = document.createElement('div'); c.className = 'col';
    c.innerHTML = '<div class="bub typing"><i></i><i></i><i></i></div>'; r.appendChild(c); });
  await sleep(3200); t.remove();
  add('row', r => { r.appendChild(avatar()); const c = document.createElement('div'); c.className = 'col';
    const w = document.createElement('div'); w.className = 'who'; w.textContent = SENDER;
    const b = document.createElement('div'); b.className = 'bub'; b.textContent = MESSAGE;
    c.append(w, b); r.appendChild(c); });
  sfx.msg(); await sleep(3200);
  add('chip-row', r => { const b = document.createElement('button'); b.className = 'chip'; b.textContent = '🎁 Nhấn để mở quà'; b.onclick = openGift; r.appendChild(b); });
  sfx.msg();
}

// --- video quà + lá thư ---
const gift = $('gift'), vid = $('gvid'), vbox = $('vbox'), env = $('env'), letter = $('letter');
let demoTimer = 0, lTok = 0, lSkip = false;
function openGift(){
  gift.classList.add('on'); sfx.open(); $('vcover').classList.remove('hide'); $('gcap').textContent = 'Chạm vào video để phát';
  if (VIDEO){ vbox.classList.remove('novid'); if (!vid.getAttribute('src')) vid.src = VIDEO; vid.pause(); vid.currentTime = 0; }
  else vbox.classList.add('novid');
}
function playVideo(){
  $('vcover').classList.add('hide'); $('gcap').textContent = '';   // nhạc nền vẫn tiếp tục chạy khi video phát
  if (VIDEO){ vid.play().catch(() => { vid.controls = true; }); }
  else { $('vph').innerHTML = 'Đang phát video…<br>(đây là bản chạy thử)'; demoTimer = setTimeout(videoEnded, 4000); }
}
vbox.onclick = () => {
  if (!$('vcover').classList.contains('hide')) return playVideo();
  if (VIDEO){ vid.paused ? vid.play() : vid.pause(); }
};
vid.onended = videoEnded;
function videoEnded(){ setTimeout(showLetter, 1200); }
function closeGift(){ vid.pause(); clearTimeout(demoTimer); gift.classList.remove('on'); duckMusic(false); }
$('gclose').onclick = () => { sfx.close(); closeGift(); };

async function showLetter(){
  const tok = ++lTok; lSkip = false;
  $('lt').textContent = LETTER_TITLE; $('lsig').textContent = '— ' + SENDER;
  $('lsh').textContent = ''; $('lhd').textContent = LETTER; $('paper').classList.remove('done');
  env.className = 'env'; letter.classList.add('on'); void env.offsetWidth; env.classList.add('fly'); sfx.open();
  await sleep(2400); if (tok !== lTok) return;
  env.classList.add('open'); sfx.msg(); await sleep(1600); if (tok !== lTok) return;
  env.classList.add('out'); sfx.wish(1); await sleep(2600); if (tok !== lTok) return;
  for (let i = 1; i <= LETTER.length; i++){
    if (tok !== lTok) return;
    if (lSkip){ $('lsh').textContent = LETTER; $('lhd').textContent = ''; break; }
    $('lsh').textContent = LETTER.slice(0, i); $('lhd').textContent = LETTER.slice(i);
    await sleep(/[,.]/.test(LETTER[i - 1]) ? 260 : 38);
  }
  if (tok === lTok) $('paper').classList.add('done');
}
$('lp').onclick = () => { lSkip = true; };
$('lclose').onclick = () => { lTok++; sfx.close(); letter.classList.remove('on'); closeGift(); };

// --- cánh hoa rơi ---
function bloom(){
  for (let i = 0; i < 18; i++){
    const p = document.createElement('div'); p.className = 'petal'; p.textContent = ["🌸","🌷","🌹"][i % 3];
    p.style.left = Math.random() * 100 + "vw"; p.style.fontSize = (14 + Math.random() * 16) + "px";
    p.style.animationDuration = (7 + Math.random() * 7) + "s"; p.style.animationDelay = (-Math.random() * 10) + "s";
    document.body.appendChild(p);
  }
}
</script>
</body>
</html>
